# Arm definitions for the 6-way FraudOps-Bench comparison.
# flow: direct | linear | agentic | classical_ml
# backend: anthropic | ollama | (none, for classical_ml)
arms:
  direct_control:
    flow: direct
    backend: anthropic
    model: claude-sonnet-5
    # No case-specific evidence exists in this arm, so two draws "agreeing"
    # near the neutral anchor (0.5) is the model honestly reporting "no
    # signal" twice, not corroborated confidence -- self-consistency's
    # premise doesn't hold here. See flows.py's _run_completion_flow.
    self_consistency: false

  linear_api:
    flow: linear
    backend: anthropic
    model: claude-sonnet-5

  linear_local:
    flow: linear
    backend: ollama
    model: qwen2.5:14b-instruct

  agentic_api:
    flow: agentic
    backend: anthropic
    model: claude-sonnet-5

  agentic_local:
    flow: agentic
    backend: ollama
    model: qwen2.5:14b-instruct

  linear_gpt:
    flow: linear
    backend: openai
    model: gpt-5.6-terra

  agentic_gpt:
    flow: agentic
    backend: openai
    model: gpt-5.6-terra

  # linear_retrieval/agentic_retrieval: same Claude Sonnet 5 model and flow
  # as linear_api/agentic_api, but with k=5 nearest-neighbor exemplars from
  # the dedicated retrieval_pool split (src/retrieval.py) injected into the
  # prompt -- testing whether grounding fraud_probability in comparable
  # past outcomes reduces the round-number discretization diagnosed in
  # Section 5.3 (see docs/future_work.md).
  linear_retrieval:
    flow: linear
    backend: anthropic
    model: claude-sonnet-5
    use_retrieval: true

  agentic_retrieval:
    flow: agentic
    backend: anthropic
    model: claude-sonnet-5
    use_retrieval: true

  classical_ml:
    flow: classical_ml
    model: hgb # or logreg

  # Optional stretch arm: params-scaling comparison point, zero download
  # cost (already pulled). Not part of the core 6-arm comparison.
  linear_local_7b:
    flow: linear
    backend: ollama
    model: qwen2.5:7b-instruct

backend_defaults:
  anthropic:
    # claude-sonnet-5 writes verbose, fully-cited evidence_used/risk_indicators
    # entries on the linear/agentic prompts (which include full tool-evidence
    # text), and the tightened SOP (naming the specific check that justifies
    # ESCALATE, plus check_verdicts detail per required check) makes
    # reasoning longer still -- 4096 truncated ~20% of linear_api responses
    # mid-JSON, and 6144 still truncated 8/120 (6.7%) on the calibration
    # split (output_tokens hit exactly 6144 on every failure -- confirmed
    # truncation, not random parse noise). 8192 stays well under the ~16K
    # non-streaming timeout risk while giving real headroom.
    max_tokens: 8192
    # NOTE: temperature/top_p/top_k are intentionally omitted. claude-sonnet-5
    # and claude-opus-5 return 400 if these are set to non-default values.
  ollama:
    temperature: 0.0
    num_ctx: 8192
    base_url: http://localhost:11434
  openai:
    # Validated 2026-08-28 on the dev split (n=50 per arm, linear_gpt +
    # agentic_gpt): 0/50 truncations for both arms at this value (same
    # methodology used to derive the Anthropic value above -- run a pilot,
    # check parse_status/finish_reason for truncation, iterate until clean).
    # Observed headroom was comfortable, not borderline: linear_gpt's
    # largest case used 4,251 of 16,384 tokens (output + reasoning
    # combined); agentic_gpt's largest single-node output was 4,721. No
    # reason to raise it; no reason to lower it either since the cap only
    # bounds worst-case behavior; billing is on actual tokens used, not the
    # cap. gpt-5.6-terra rejects 'temperature'/'top_p' outright (400: only
    # the default is supported) -- intentionally omitted here, same as the
    # comment above for Anthropic. This key is still named max_tokens (not
    # max_completion_tokens) because run_baseline.py's CALL_KWARG_KEYS only
    # forwards a key literally named max_tokens; llm_backends.py's
    # call_openai() and agentic_graph.py's _get_chat_model() both translate
    # it internally to whatever the real API/SDK needs.
    max_tokens: 16384

retry:
  max_retries: 5
  base_delay_s: 2.0
  max_delay_s: 60.0

# Documented swap for a final/expensive run once the pipeline is validated
# cheaply on claude-sonnet-5. Edit an arm's `model` to "claude-opus-5" to use it.
